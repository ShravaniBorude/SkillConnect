spring:
  datasource:
    url: jdbc:h2:mem:skillconnect_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-jwt-secret-key-that-is-at-least-64-characters-long-for-hs256-signing
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  razorpay:
    key-id: rzp_test_unit_key
    key-secret: rzp_test_unit_secret
    platform-fee-percent: 10.0
  storage:
    local-upload-dir: ./target/test-uploads
